[package]
name = "host"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "=49.0.3", features = ["component-model", "component-model-async"] }
wasmtime-wasi = { version = "=49.0.3", features = ["p3"] }
wasmtime-wasi-http = { version = "=49.0.3", default-features = false, features = [
    "p2",
    "p3",
    "default-send-request",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
http = "1"
http-body-util = "0.1"
sha2 = "0.10"
tracing = "0.1"
wasmparser = "=0.258.3"
wasmprinter = "=0.258.3"

[dev-dependencies]
wat = "=1.262.0"
tracing-subscriber = { version = "0.3", features = ["registry"] }
