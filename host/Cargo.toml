[package]
name = "host"
version = "0.1.0"
edition = "2024"

[dependencies]
wasmtime = { version = "=49.0.3", features = ["component-model"] }
wasmtime-wasi = "=49.0.3"
wasmtime-wasi-http = { version = "=49.0.3", default-features = false, features = [
    "p2",
    "default-send-request",
] }
ureq = { version = "=3.4.2", features = ["json", "platform-verifier"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
http = "1"
http-body-util = "0.1"
