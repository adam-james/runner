[package]
name = "openai"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# WASI 0.3 bindings (`wasi:http/client` for the streaming request) and the
# wit-bindgen async runtime they're built on, shared with this crate's own
# bindings.
wasip3 = { version = "=0.9.0", features = ["wit-bindgen-macros", "async-spawn"] }
serde_json = "1"
