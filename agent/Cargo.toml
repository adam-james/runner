[package]
name = "agent"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Also supplies wit-bindgen (with its async runtime), so the agent's own
# bindings and the `wasi:cli/run` export share one copy of it.
wasip3 = { version = "=0.9.0", features = ["wit-bindgen-macros"] }
serde_json = { version = "1", features = ["preserve_order"] }
