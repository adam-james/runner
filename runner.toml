agent = "target/wasm32-wasip2/release/agent.wasm"

# [provider]
# path = "target/wasm32-wasip2/release/anthropic.wasm"
# model = "claude-sonnet-5"
# allowed_hosts = ["api.anthropic.com"]
# headers = { x-api-key = { value = "${ANTHROPIC_API_KEY}", hosts = ["api.anthropic.com"] } }

[provider]
path = "target/wasm32-wasip2/release/openai.wasm"
model = "gpt-5"
allowed_hosts = ["api.openai.com"]
headers = { authorization = { value = "Bearer ${OPENAI_API_KEY}", hosts = ["api.openai.com"] } }

[[tools]]
path = "target/wasm32-wasip2/release/weather.wasm"
allowed_hosts = ["api.open-meteo.com", "geocoding-api.open-meteo.com"]

[[tools]]
path = "target/wasm32-wasip2/release/sports.wasm"
allowed_hosts = ["site.api.espn.com"]

[[tools]]
path = "target/wasm32-wasip2/release/search.wasm"
allowed_hosts = ["api.tavily.com"]
headers = { authorization = { value = "Bearer ${TAVILY_API_KEY}", hosts = ["api.tavily.com"] } }

# Runs Python the model writes, so it's boxed in more tightly than the rest.
# Built by `cargo run -p build-python --release`.
[[tools]]
path = "target/wasm32-wasip2/release/python.wasm"
timeout_secs = 10
max_memory_mb = 256
fresh_per_call = true
#
# No files by default. To give scripts a directory, seen as their `/`, use a
# dedicated one, not your repo or home directory: scripts see everything in
# it, and with dir_writable can change or delete any of it.
#
# Read-only, e.g. data for the model to analyze. The directory must exist:
#   mkdir -p ~/.runner/python && cp sales.csv ~/.runner/python/
# dir = "${HOME}/.runner/python"
#
# Or writable too, e.g. a scratch space for results that outlive the call.
# Created if missing. Nothing limits how much scripts write:
# dir = "${HOME}/.runner/python-scratch"
# dir_writable = true

[session_store]
path = "target/wasm32-wasip2/release/fs_store.wasm"
dir = "${HOME}/.runner/sessions"
dir_writable = true
